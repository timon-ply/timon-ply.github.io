schema: 1
id: legal-docs
repository: timon-ply/timon-ply.github.io
default_branch: main
stack: node
runtime:
  node: 22
commands:
  bootstrap: sh scripts/remote/bootstrap.sh
  doctor: sh scripts/remote/doctor.sh
  verify: sh scripts/remote/verify.sh
  preview: sh scripts/remote/preview.sh
