<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="Wünsche sammeln, die Liste teilen und Geschenke reservieren.">
  <meta name="referrer" content="no-referrer">
  <title>Wunschkiste</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=5.2">
  <script src="config.js?v=5.2"></script>
  <script src="app.js?v=5.2" type="module"></script>
</head>
<body>
  <a href="#main" class="skip">Zum Inhalt springen</a>
  <div class="app-shell">
    <header class="appbar">
      <div class="list-heading"><h1 id="list-title">Wunschkiste</h1><p id="list-date-label" hidden></p></div>
      <nav class="app-actions" aria-label="Listenaktionen" id="app-actions"></nav>
    </header>
    <main id="main" tabindex="-1">
      <img id="list-cover" class="list-cover" alt="" hidden>
      <p id="list-description" class="list-description" hidden></p>
      <div id="app" aria-busy="true"><div class="loading" role="status">Liste wird geladen …</div></div>
    </main>
  </div>
  <div id="add-dock" class="add-dock"></div>
  <dialog class="sheet" id="invite-dialog" aria-labelledby="invite-title">
    <form class="sheet-body" id="open-link-form" novalidate>
      <div class="sheet-heading"><h2 id="invite-title">Einladungslink öffnen</h2><button type="button" class="icon-button close" aria-label="Schließen" data-action="close">×</button></div>
      <label for="invite-url">Einladungslink</label>
      <input id="invite-url" inputmode="url" placeholder="https://…" required autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="field-error" id="invite-error" role="alert" hidden></p>
      <button class="primary full" type="submit">Öffnen</button>
    </form>
  </dialog>
  <dialog class="sheet" id="list-dialog" aria-labelledby="list-dialog-title">
    <form id="list-form" class="sheet-body" novalidate>
      <div class="sheet-heading"><h2 id="list-dialog-title">Liste erstellen</h2><button type="button" class="icon-button close" aria-label="Schließen" data-action="close">×</button></div>
      <button type="button" class="cover-select" id="cover-select" aria-expanded="false" aria-controls="cover-panel"><img id="selected-cover" alt=""><span>Bild auswählen</span></button>
      <div id="cover-panel" hidden><div id="cover-options" class="cover-grid" role="group" aria-label="Kistenbild auswählen"></div></div>
      <label for="list-name">Name</label>
      <input id="list-name" name="title" maxlength="80" required placeholder="Mein Geburtstag" autocomplete="off">
      <p class="field-error" id="list-error" role="alert" hidden></p>
      <label for="list-date">Datum <span class="optional">optional</span></label>
      <input id="list-date" name="date" type="date">
      <label for="list-description-input">Beschreibung</label>
      <textarea id="list-description-input" name="description" rows="2" maxlength="240" placeholder="Was sollen deine Gäste wissen?"></textarea>
      <button class="primary full" type="submit" id="list-submit">Erstellen</button>
    </form>
  </dialog>
  <dialog class="sheet" id="wish-dialog" aria-labelledby="wish-dialog-title">
    <form id="wish-form" class="sheet-body" novalidate>
      <div class="sheet-heading"><h2 id="wish-dialog-title">Wunsch hinzufügen</h2><button type="button" class="icon-button close" aria-label="Schließen" data-action="close">×</button></div>
      <label for="wish-url">Produktlink</label>
      <input id="wish-url" name="url" type="text" inputmode="url" maxlength="2000" placeholder="https://…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p id="import-status" class="import-status" role="status" hidden></p>
      <div id="import-image" class="import-image" hidden><img id="product-image" alt="" referrerpolicy="no-referrer"><button class="text-button" type="button" data-action="change-image">Bild ändern</button></div>
      <label for="wish-name">Name</label>
      <input id="wish-name" name="title" maxlength="90" required placeholder="Was wünschst du dir?" autocomplete="off">
      <div id="price-position"></div>
      <details class="extra-fields" id="extra-fields">
        <summary>Weitere Angaben</summary>
        <div id="price-field"><label for="wish-price">Preis (€)</label><input id="wish-price" name="price" inputmode="decimal" maxlength="12" placeholder="z. B. 49,99"><p class="small-note" id="price-hint" hidden>Preis bitte prüfen.</p></div>
        <label for="wish-note">Beschreibung</label>
        <textarea id="wish-note" name="note" rows="2" maxlength="240" placeholder="Farbe, Größe …"></textarea>
        <label for="wish-image">Bildlink</label>
        <input id="wish-image" name="imageUrl" inputmode="url" maxlength="2000" placeholder="https://…" autocapitalize="off" spellcheck="false">
      </details>
      <p class="field-error" id="wish-error" role="alert" hidden></p>
      <button class="primary full" type="submit" id="wish-submit">Hinzufügen</button>
    </form>
  </dialog>
  <dialog class="sheet detail-sheet" id="detail-dialog" aria-labelledby="detail-title">
    <div class="sheet-body">
      <button type="button" class="icon-button detail-close" aria-label="Schließen" data-action="close">×</button>
      <div id="detail-content"></div>
      <p class="field-error" id="detail-error" role="alert" hidden></p>
    </div>
  </dialog>
  <dialog class="sheet" id="share-dialog" aria-labelledby="share-title">
    <div class="sheet-body">
      <div class="sheet-heading"><h2 id="share-title">Liste teilen</h2><button type="button" class="icon-button close" aria-label="Schließen" data-action="close">×</button></div>
      <div id="invite-code-row" hidden><label for="invite-code">Einladungscode für die App</label><div class="copy-row"><input id="invite-code" readonly><button type="button" class="secondary" id="copy-invite-code">Kopieren</button></div></div>
      <label for="guest-link">Gästelink</label>
      <div class="copy-row"><input id="guest-link" readonly><button type="button" class="primary" data-action="copy-guest" aria-live="polite">Kopieren</button></div>
      <p class="small-note" id="share-note"></p>
      <details class="private-link" id="private-link">
        <summary>Verwaltungslink sichern</summary>
        <div class="copy-row"><input id="owner-link" aria-label="Verwaltungslink" readonly><button type="button" class="secondary" data-action="copy-owner" aria-live="polite">Kopieren</button></div>
        <p class="small-note">Nur für dich. Mit diesem Link lässt sich die Liste bearbeiten.</p>
      </details>
    </div>
  </dialog>
  <dialog class="sheet" id="menu-dialog" aria-labelledby="menu-title">
    <div class="sheet-body">
      <div class="sheet-heading"><h2 id="menu-title">Deine Liste</h2><button type="button" class="icon-button close" aria-label="Schließen" data-action="close">×</button></div>
      <button class="menu-row" id="menu-edit" data-action="edit-list" type="button">Liste bearbeiten <span>›</span></button>
      <button class="menu-row" id="menu-guest" data-action="guest-view" type="button">Gästeansicht <span>›</span></button>
      <button class="menu-row" id="menu-lists" data-action="saved-lists" type="button">Meine Wunschkisten <span>›</span></button>
      <button class="menu-row" data-action="new-list" type="button">Neue Wunschkiste <span>›</span></button>
    </div>
  </dialog>
  <dialog class="sheet" id="saved-dialog" aria-labelledby="saved-title">
    <div class="sheet-body">
      <div class="sheet-heading"><h2 id="saved-title">Meine Wunschkisten</h2><button type="button" class="icon-button close" aria-label="Schließen" data-action="close">×</button></div>
      <div id="saved-list-rows"></div>
      <button class="text-button new-list-link" type="button" data-action="new-list">+ Neue Wunschkiste</button>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="undo-button" hidden>Rückgängig</button></div>
  <noscript><p>Bitte aktiviere JavaScript, um die Wunschliste zu nutzen.</p></noscript>
</body>
</html>
